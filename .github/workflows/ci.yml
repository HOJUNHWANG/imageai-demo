name: ci

on:
  push:
    paths:
      - "backend/**"
      - "*.py"
      - "requirements*.txt"
      - "frontend/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "*.py"
      - "requirements*.txt"
      - "frontend/**"
      - "package*.json"
      - ".github/workflows/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.11.8

      - name: Syntax check
        run: |
          python -m py_compile backend/main.py mp_tasks_utils.py prompt_enricher.py segformer_masks.py

      - name: Lint (ruff)
        run: |
          ruff check backend/ mp_tasks_utils.py prompt_enricher.py segformer_masks.py --select=E9,F8,F4 --ignore=F401

      - name: Doctor (expected to fail if weights missing)
        run: |
          python scripts/doctor.py || true

      - name: Backend smoke (MOCK_INPAINT)
        env:
          MOCK_INPAINT: "1"
        run: |
          python -c "import backend.main; print('backend ok')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Frontend build check
        run: |
          cd frontend
          npm ci
          npm run build
