name: ci

permissions:
  contents: read

on:
  push:
    paths:
      - "backend/**"
      - "tests/**"
      - "scripts/**"
      - "*.py"
      - "requirements*.txt"
      - "frontend/**"
      - "package*.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "scripts/**"
      - "*.py"
      - "requirements*.txt"
      - "frontend/**"
      - "package*.json"
      - ".github/workflows/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: |
          python -m compileall -q backend tests scripts

      - name: Lint (ruff)
        run: |
          python -m ruff check backend tests scripts

      - name: Tests
        run: |
          python -m pytest -q

      - name: Doctor
        run: |
          python scripts/doctor.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build check
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev
          npm run lint
          npm run build
