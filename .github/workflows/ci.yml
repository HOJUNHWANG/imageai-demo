name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile backend/main.py mp_tasks_utils.py prompt_enricher.py segformer_masks.py

      - name: Doctor (expected to fail if weights missing)
        run: |
          python scripts/doctor.py || true

      - name: Backend smoke (MOCK_INPAINT)
        env:
          MOCK_INPAINT: "1"
        run: |
          python -c "import backend.main; print('backend ok')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend build check
        run: |
          cd frontend
          npm install
          npm run build
